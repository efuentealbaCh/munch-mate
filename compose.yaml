# Base definition of every service. Never used alone:
#   dev  → docker compose -f compose.yaml -f compose.dev.yaml  (infra only, ports on 127.0.0.1)
#   prod → docker compose -f compose.yaml -f compose.prod.yaml (full stack behind Caddy)
# Values come from .env (see .env.example).
name: munch-mate

x-node-app-env: &node-app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=${MONGO_DB}
  VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379

x-node-app-depends: &node-app-depends
  mongo:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  mongo:
    image: mongo:8.0.32
    entrypoint: ["bash", "/opt/munch-mate/mongo-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_DB: ${MONGO_DB:?set in .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./infra/mongo/mongo-entrypoint.sh:/opt/munch-mate/mongo-entrypoint.sh:ro
      - ./infra/mongo/rs-healthcheck.js:/opt/munch-mate/rs-healthcheck.js:ro
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin /opt/munch-mate/rs-healthcheck.js
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1.10-alpine
    # noeviction is mandatory for BullMQ; appendonly persists queues across restarts.
    command: ["sh", "-c", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --maxmemory-policy noeviction']
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set in .env}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/nest.Dockerfile
      args:
        APP: api
    image: ${REGISTRY:-munch-mate}/api:${TAG:-local}
    environment:
      <<: *node-app-env
      APP_URL: https://${DOMAIN:?set in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
    depends_on: *node-app-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  workers:
    build:
      context: .
      dockerfile: infra/docker/nest.Dockerfile
      args:
        APP: workers
    image: ${REGISTRY:-munch-mate}/workers:${TAG:-local}
    environment:
      <<: *node-app-env
      HEALTH_PORT: 3001
      SMTP_HOST: ${SMTP_HOST:?set in .env}
      SMTP_PORT: ${SMTP_PORT:?set in .env}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?set in .env}
    depends_on: *node-app-depends
    # Let in-flight jobs finish on deploy/restart before Docker sends SIGKILL (default is 10s).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMAIN:?set in .env}
    image: ${REGISTRY:-munch-mate}/web:${TAG:-local}
    environment:
      API_INTERNAL_URL: http://api:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Must persist: losing it means re-requesting certificates and hitting Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  mongo_config:
  valkey_data:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
