# Development override: infrastructure in Docker, apps on the host with `pnpm dev`.
# Ports bind to 127.0.0.1 only, so nothing is reachable from the local network.
services:
  mongo:
    ports:
      - "127.0.0.1:27017:27017"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  garage:
    ports:
      - "127.0.0.1:3900:3900"

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
