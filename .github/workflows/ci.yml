name: CI

on:
  pull_request:
  push:
    branches: [main, developer]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Docker is available on ubuntu runners, so Testcontainers works as it does locally.
      - run: pnpm test:int
      - run: pnpm test:e2e

  images:
    # Images are only published from main: the VPS deploys a commit SHA that passed CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: infra/docker/nest.Dockerfile
          - app: workers
            dockerfile: infra/docker/nest.Dockerfile
          - app: web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Registry name (GHCR requires lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_APP_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
